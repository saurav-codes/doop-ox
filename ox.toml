# Libraries headless Chrome needs on Ubuntu, as in the penpot-ox deploy.
packages = [
  "libasound2t64", "libatk-bridge2.0-0t64", "libatk1.0-0t64", "libatspi2.0-0t64",
  "libcairo2", "libcups2t64", "libdbus-1-3", "libdrm2", "libgbm1", "libglib2.0-0t64",
  "libnspr4", "libnss3", "libpango-1.0-0", "libx11-6", "libxcb1", "libxcomposite1",
  "libxdamage1", "libxext6", "libxfixes3", "libxkbcommon0", "libxrandr2",
  "fonts-liberation", "fonts-noto-color-emoji",
]

# Doop runs its own migrations at boot (server/db/index.ts), so ox
# must not run drizzle-kit, which has no database URL to read.
[build]
migrate = ""
# Ubuntu's chromium is a snap, which ox refuses, so puppeteer fetches a
# headless Chrome into the persistent data dir for frame screenshots.
commands = [
  "bun run build",
  "bunx @puppeteer/browsers install chrome-headless-shell@stable --path \"$OX_DATA_DIR/chrome\"",
  "ln -sfn \"$(find \"$OX_DATA_DIR/chrome\" -type f -name chrome-headless-shell | head -n 1)\" \"$OX_DATA_DIR/chrome-headless-shell\"",
]

[tools]
# tsx runs under Node; without it ox left `node` to Bun, which cannot load tsx.
node = "22"

[services]
postgres = {}
